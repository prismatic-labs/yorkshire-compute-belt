name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run validate:data
      # Must run before build: build's prebuild re-syncs public/data and would
      # hide a data commit that never published its copy.
      - run: npm run check:data-sync
      - run: npm run build
